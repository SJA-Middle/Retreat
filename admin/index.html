<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17214A">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="수련회 운영">
<title>수련회 운영</title>
<link rel="icon" href="../logo.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<link rel="stylesheet" href="../style.css">
<style>
body { min-height: 100vh; }
/* 로그인 */
#login { min-height: 100vh; display: flex; flex-direction: column; }
#login .sky { padding: calc(56px + env(safe-area-inset-top)) 24px 90px; text-align: left; }
#login .sky .in { max-width: 420px; margin: 0 auto; }
#login h1 { font-family: var(--display); font-weight: 400; font-size: 44px; line-height: 1.05; margin-top: 18px; }
#login .sky p { color: #ffffffbb; margin-top: 10px; font-size: 15px; }
#login .org { font-size: 17px; font-weight: 700; }
#login form { margin-bottom: 28px !important; }
#login form { max-width: 420px; width: calc(100% - 32px); margin: -36px auto 0; background: var(--paper); border-radius: var(--r-l); padding: 24px 20px; position: relative; box-shadow: 0 14px 30px -20px #17214A66; }
#login .pin { letter-spacing: .5em; text-align: center; font-size: 22px; font-variant-numeric: tabular-nums; }
.org { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #ffffffcc; font-weight: 600; }
.org img { height: 30px; width: auto; background: #fff; border-radius: 8px; padding: 3px 7px; }

/* 앱 틀 */
.top { position: sticky; top: 0; z-index: 20; background: var(--night); color: #fff; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; }
.top .in { max-width: 860px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.top h1 { font-family: var(--display); font-weight: 400; font-size: 21px; line-height: 1.2; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .who { font-size: 13px; color: #ffffffbb; white-space: nowrap; }
.ibtn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: #ffffff1a; color: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
.ibtn svg { width: 20px; height: 20px; }
.ibtn.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
main { max-width: 860px; margin: 0 auto; padding: 16px 16px calc(100px + env(safe-area-inset-bottom)); }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--paper); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
nav.tabs .in { max-width: 620px; margin: 0 auto; display: flex; }
nav.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border: 0; background: none; font-size: 12px; font-weight: 600; color: var(--mist); cursor: pointer; border-radius: 12px; }
nav.tabs svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--night); }
nav.tabs button[aria-current="page"] svg { stroke: var(--night); }

/* 공통 블록 */
.sec { margin: 0 0 22px; }
.sec > h2 { font-size: 18px; margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sec > h2 small { font-size: 14px; color: var(--sub); font-weight: 500; }
.box { background: var(--paper); border-radius: var(--r-m); padding: 16px; }
.box + .box { margin-top: 10px; }
.stat > .box, .mix > .box { margin-top: 0; }
.muted { color: var(--sub); font-size: 14px; }
.empty { text-align: center; padding: 36px 16px; color: var(--sub); }
.empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }
.empty .btn { margin-top: 16px; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--night); border-radius: 4px; }
.bar.over i { background: var(--alert); }
.bar.ok i { background: var(--pine); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper); font-size: 14px; font-weight: 600; color: var(--sub); cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--night); border-color: var(--night); color: #fff; }
.search { position: relative; margin-bottom: 8px; }
.search .inp { padding-left: 42px; }
.search svg { position: absolute; left: 14px; top: 15px; width: 20px; height: 20px; color: var(--mist); }

/* 홈 */
.hero { background: var(--night); color: #fff; border-radius: var(--r-l); padding: 20px 20px 22px; position: relative; overflow: hidden; margin-bottom: 18px; }
.hero .dday { font-family: var(--display); font-weight: 400; font-size: 54px; line-height: 1; color: var(--lantern); }
.hero .sub { color: #ffffffcc; font-size: 15px; margin-top: 8px; }
.hero .t { font-size: 15px; font-weight: 700; color: #fff; }
.stat { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat .box { padding: 14px 16px; }
.stat .k { font-size: 14px; color: var(--sub); }
.stat .v { font-size: 28px; font-weight: 800; line-height: 1.2; margin: 2px 0 8px; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 15px; font-weight: 600; color: var(--sub); }
.split { display: flex; gap: 6px; flex-wrap: wrap; }
.mix { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mix table { width: 100%; border-collapse: collapse; font-size: 14px; }
.mix td { padding: 5px 0; border-bottom: 1px solid var(--line); }
.mix td:first-child { font-weight: 600; }
.mix tr:last-child td { border-bottom: 0; }
.issues { list-style: none; margin: 0; padding: 0; }
.issues li { display: flex; gap: 10px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 15px; cursor: pointer; }
.issues li:last-child { border-bottom: 0; }
.issues li::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--lantern-deep); flex: none; margin-top: 8px; }
.issues li.hard::before { background: var(--alert); }
.linkbox { display: flex; gap: 14px; align-items: center; }
.linkbox img { width: 104px; height: 104px; border-radius: 10px; border: 1px solid var(--line); flex: none; background: #fff; }
.linkbox .u { font-size: 14px; word-break: break-all; color: var(--sub); margin: 4px 0 10px; }

/* 명단 */
.plist { background: var(--paper); border-radius: var(--r-m); overflow: hidden; }
.prow { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.prow:last-child { border-bottom: 0; }
.prow:active { background: var(--snow); }
.av { width: 38px; height: 38px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex: none; }
.av.m { background: var(--boy-soft); color: var(--boy); }
.av.f { background: var(--girl-soft); color: var(--girl); }
.prow .nm { font-weight: 700; font-size: 16px; }
.prow .ds { font-size: 13px; color: var(--sub); }
.prow .mid { flex: 1; min-width: 0; }
.prow .end { display: flex; gap: 6px; align-items: center; flex: none; }
.prow.off { opacity: .5; }
.prow.pay { cursor: default; }
.paybtn { flex: none; min-width: 92px; min-height: 42px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--night); background: var(--paper); color: var(--night); font-size: 15px; font-weight: 700; cursor: pointer; }
.paybtn[aria-pressed="true"] { background: var(--pine); border-color: var(--pine); color: #fff; }
.paybtn[aria-pressed="true"]::before { content: '✓ '; }
.paysum { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 2px 10px; font-size: 14px; color: var(--sub); }
.paysum b { color: var(--ink); font-size: 18px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dot.paid { background: var(--pine); } .dot.unpaid { background: var(--line); border: 1.5px solid var(--mist); }
.count { font-size: 14px; color: var(--sub); margin: 4px 2px 8px; display: flex; justify-content: space-between; align-items: center; }

/* 조·방 */
.rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.room { background: var(--paper); border-radius: var(--r-m); padding: 14px 16px 12px; border-top: 4px solid var(--boy); }
.room.f { border-top-color: var(--girl); }
.room.none { border-top-color: var(--lantern-deep); }
.room .hd { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.room .no { font-family: var(--display); font-weight: 400; font-size: 38px; line-height: 1; color: var(--night); min-width: 36px; }
.room .no small { font-family: var(--body); font-size: 15px; font-weight: 700; margin-left: 1px; }
.room .meta { flex: 1; min-width: 0; font-size: 14px; color: var(--sub); line-height: 1.4; }
.room .meta b { color: var(--ink); font-size: 15px; }
.room .cnt { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 15px; }
.room .bar { margin-bottom: 10px; }
.mem { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; }
.mem button { display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 6px 2px; font-size: 15px; text-align: left; cursor: pointer; border-radius: 8px; min-width: 0; }
.mem button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mem button:active { background: var(--snow); }
.mem i { font-style: normal; font-size: 12px; color: var(--mist); flex: none; }
.mem .wish { width: 7px; height: 7px; border-radius: 50%; background: var(--pine); flex: none; }
.mem .miss { width: 7px; height: 7px; border-radius: 50%; background: var(--lantern-deep); flex: none; }
.mem .nowish { width: 7px; flex: none; }
.mem i.hl { color: #8A5E00; background: #FDF1D2; border-radius: 6px; padding: 0 4px; font-weight: 700; font-size: 11px; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--sub); margin: 0 2px 12px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }

/* 버스 */
.bus { background: var(--paper); border-radius: var(--r-m); margin-bottom: 12px; overflow: hidden; }
.bus > .hd { display: flex; align-items: center; gap: 14px; padding: 16px; cursor: pointer; }
.bus .no { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1; color: var(--night); }
.bus .meta { flex: 1; }
.bus .meta b { font-size: 16px; }
.bus .meta .bar { margin-top: 8px; }
.bus .chk { font-size: 14px; font-weight: 700; color: var(--pine); white-space: nowrap; }
.bus .body { border-top: 1px solid var(--line); padding: 4px 16px 12px; }
.bus .grp { font-size: 13px; font-weight: 700; color: var(--sub); margin: 12px 0 4px; }
.brow { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.brow:last-child { border-bottom: 0; }
.brow input { width: 24px; height: 24px; accent-color: var(--pine); flex: none; margin: 0; }
.brow label { flex: 1; display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 16px; }
.brow .tel { font-size: 13px; }

/* 일정 */
.days { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; }
.days button { flex: 1 0 auto; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); font-weight: 700; color: var(--sub); cursor: pointer; font-size: 15px; }
.days button small { display: block; font-size: 12px; font-weight: 500; }
.days button[aria-pressed="true"] { background: var(--night); color: #fff; border-color: var(--night); }
.tl { background: var(--paper); border-radius: var(--r-m); padding: 6px 0; }
.ti { display: grid; grid-template-columns: 72px 1fr; gap: 12px; padding: 12px 16px; border-left: 4px solid transparent; }
.ti + .ti { border-top: 1px solid var(--line); }
.ti .tm { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 16px; }
.ti .tm small { display: block; font-weight: 500; color: var(--mist); font-size: 13px; }
.ti .tt { font-weight: 700; font-size: 16px; }
.ti .td { font-size: 14px; color: var(--sub); margin-top: 2px; }
.ti.now { border-left-color: var(--lantern); background: #FFFBEF; }
.ti.now .tm::after { content: '지금'; display: inline-block; margin-left: 6px; font-size: 11px; padding: 0 6px; border-radius: 999px; background: var(--lantern); color: var(--night); vertical-align: 2px; }
.ed { display: grid; grid-template-columns: 76px 76px 1fr; gap: 6px; padding: 12px; border-bottom: 1px solid var(--line); }
.ed .inp { min-height: 42px; padding: 8px 10px; font-size: 15px; }
.ed .full { grid-column: 1 / -1; }
.ed .two { grid-column: span 2; }
.ed .del { grid-column: 3; justify-self: end; }

/* 연락망 */
.crow { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.crow:last-child { border-bottom: 0; }
.crow .mid { flex: 1; min-width: 0; }
.crow .nm { font-weight: 700; }
.crow .ds { font-size: 13px; color: var(--sub); }
.call { width: 44px; height: 44px; border-radius: 50%; background: var(--pine-soft); color: var(--pine); display: inline-flex; align-items: center; justify-content: center; flex: none; text-decoration: none; }
.call.sms { background: var(--snow); color: var(--night-2); }
.call svg { width: 20px; height: 20px; }
.hcard { padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.hcard:last-child { border-bottom: 0; }
.hcard b { font-size: 15px; }
.hcard p { font-size: 14px; color: var(--ink); margin-top: 2px; white-space: pre-line; }

/* 시트(아래에서 올라오는 창) */
.scrim { position: fixed; inset: 0; background: #17214A66; z-index: 40; opacity: 0; transition: opacity .2s; }
.scrim.on { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 92vh; overflow-y: auto; background: var(--snow); border-radius: 22px 22px 0 0; transform: translateY(100%); transition: transform .25s cubic-bezier(.2, .8, .2, 1); padding-bottom: env(safe-area-inset-bottom); overscroll-behavior: contain; }
.sheet.on { transform: none; }
.sheet .in { max-width: 620px; margin: 0 auto; padding: 0 16px 24px; }
.sheet .grab { position: sticky; top: 0; background: var(--snow); padding: 10px 0 10px; z-index: 2; display: flex; align-items: center; gap: 10px; }
.sheet .grab h2 { flex: 1; font-size: 22px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sheet .x { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--paper); cursor: pointer; font-size: 22px; line-height: 1; color: var(--sub); }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 9px 12px; font-size: 15px; }
.kv dt { color: var(--sub); }
.kv dd { margin: 0; font-weight: 600; min-width: 0; }
.kv dd a { color: var(--night-2); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.acts .btn { flex: 1 1 140px; }
.sheet h3 { font-size: 15px; color: var(--sub); margin: 18px 2px 8px; }
.wl { list-style: none; padding: 0; margin: 0; }
.wl li { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.ask { position: fixed; inset: 0; z-index: 45; display: flex; align-items: center; justify-content: center; padding: 20px; }
.ask .card { background: var(--paper); border-radius: var(--r-l); padding: 22px 20px 18px; max-width: 380px; width: 100%; box-shadow: 0 20px 50px -20px #17214A99; }
.ask p { white-space: pre-line; }
.ask .acts { margin-top: 18px; }

/* 설정 */
.rt { display: grid; grid-template-columns: 56px 74px 1fr; gap: 6px; padding: 12px; border-bottom: 1px solid var(--line); }
.rt .inp { min-height: 42px; padding: 8px 10px; font-size: 15px; }
.rt .wide { grid-column: span 2; }
.rt .full { grid-column: 1 / -1; display: flex; gap: 6px; }
.rt .full .inp { flex: 1; }
.acc { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.acc:last-child { border-bottom: 0; }
.acc .nm { font-weight: 700; flex: 1; min-width: 120px; }
.danger { border: 1.5px solid #F2C9C5; }
@media (min-width: 720px) {
  .stat { grid-template-columns: repeat(4, 1fr); }
  .mem { grid-template-columns: 1fr 1fr 1fr; }
}
.seg { display: flex; background: #E6E9F2; border-radius: 12px; padding: 3px; margin-bottom: 12px; }
.seg button { flex: 1; border: 0; background: none; padding: 9px 8px; border-radius: 10px; font-weight: 700; font-size: 15px; color: var(--sub); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px #17214A22; }
.tsum { display: grid; gap: 8px; }
.tsum > div { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tsum .k { font-size: 13px; color: var(--sub); width: 34px; flex: none; }
.rchips button { flex: 0 0 auto; min-width: 64px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; }
.rchips button small { font-size: 11px; font-weight: 500; opacity: .8; }
.dep { margin-bottom: 10px; padding: 12px 14px; }
.dep .dh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.dep .dg { font-size: 13px; font-weight: 700; color: var(--sub); margin: 10px 0 4px; }
.drow { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 15px; }
.drow .muted { flex: 1; font-size: 13px; }
.drow .link { font-weight: 700; color: var(--ink); text-decoration: none; }
.mix td.n { text-align: right; width: 34px; font-variant-numeric: tabular-nums; font-weight: 600; }
.mix td.cm { color: #5B8DEF; }
.mix td.cf { color: #E5717C; }
.mix td.ct { color: var(--ink); font-weight: 800; width: 40px; }
.mix tr.h td { font-size: 12px; font-weight: 600; padding-bottom: 3px; }
.mix tr.h td.ct { font-weight: 700; }
.mix tr.sum td { border-top: 1.5px solid var(--ink); border-bottom: 0; font-weight: 700; }
@media (max-width: 480px) { .mix { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="busy"></div>

<section id="login" hidden>
  <div class="sky"><div class="in">
    <div class="org">새중앙교회 중등부 수련회</div>
    <h1>수련회 운영</h1>
    <p>관리자와 조 담당 선생님이 쓰는 화면이에요.</p>
  </div>
  <svg class="ridge" viewBox="0 0 400 56" preserveAspectRatio="none" aria-hidden="true"><path d="M0 56 L0 38 L38 22 L70 34 L112 8 L150 30 L188 18 L224 36 L262 14 L300 32 L338 20 L372 34 L400 26 L400 56 Z" fill="#24336E" opacity=".9"/><path d="M0 56 L0 46 L48 34 L92 44 L140 30 L186 46 L236 34 L284 46 L330 36 L372 46 L400 40 L400 56 Z" fill="var(--snow)"/></svg>
  </div>
  <form id="lf" autocomplete="on"></form>
  <footer class="brand" style="margin-top:auto"><img src="../church.png" alt="새중앙교회" onerror="this.remove()"><img class="jd" src="../jungdeung.png" alt="드림공동체 중등부" onerror="this.remove()"></footer>
</section>

<div id="app" hidden>
  <header class="top"><div class="in">
    <h1 id="ttl">수련회</h1>
    <button class="ibtn" id="reload" aria-label="새로고침" title="새로고침"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></button>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const APPLY_URL = new URL('../', location.href).href;
const TEACHER_URL = new URL('../teacher/', location.href).href;
const KEY = 'rt-admin';
let U = null, D = null, tab = 'home', sub = {}, openId = null;

const ICON = {
  home: '<path d="M4 11l8-7 8 7v8.5a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H5.5A1.5 1.5 0 0 1 4 19.5z"/>',
  list: '<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/>',

  plan: '<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',

  sms: '<path d="M4 5h16v11H9l-5 4z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
};
const ic = (n, sw) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (sw || 1.8) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[n] + '</svg>';
const TABS = [['home', '홈'], ['list', '명단'], ['rooms', '조·방'], ['bus', '버스'], ['plan', '일정'], ['phone', '연락망']];

function toast(m) { const t = $('#toast'); t.textContent = m; t.className = 'on'; clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 2600); }
let pend = 0;
function busy(d) { pend += d; $('#busy').className = pend > 0 ? 'on' : ''; $('#reload') && $('#reload').classList.toggle('spin', pend > 0); }
async function call(a, params) {
  busy(1);
  try {
    let r;
    try { r = await fetch(window.RT_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ a, tk: U && U.tk, params: params || {} }) }); }
    catch (e) { throw new Error('인터넷 연결을 확인해 주세요.'); }
    let j;
    try { j = await r.json(); } catch (e) { throw new Error('서버가 응답하지 않아요. 잠시 후 다시 시도해 주세요.'); }
    if (!j.ok) {
      if (j.error === 'AUTH') { logout(true); throw new Error('다시 로그인해 주세요.'); }
      throw new Error(j.error || '처리하지 못했어요.');
    }
    return j.data;
  } finally { busy(-1); }
}
async function run(fn, okMsg) { try { const r = await fn(); if (okMsg) toast(okMsg); return r; } catch (e) { if (e.message) toast(e.message); } }
const isAdmin = () => U && U.role === 'admin';
const digits = s => String(s || '').replace(/\D/g, '');
const tel = p => p ? '<a href="tel:' + digits(p) + '">' + esc(p) + '</a>' : '<span class="muted">없음</span>';
const callBtn = (p, label) => p ? '<a class="call" href="tel:' + digits(p) + '" aria-label="' + esc(label) + ' 전화">' + ic('phone', 2) + '</a>' : '';
const smsBtn = (p, label) => p ? '<a class="call sms" href="sms:' + digits(p) + '" aria-label="' + esc(label) + ' 문자">' + ic('sms', 2) + '</a>' : '';
const gcls = g => g === '여' ? 'f' : 'm';
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }, del(k) { try { localStorage.removeItem(k); } catch (e) { } } };

// ───── 확인 창 ─────
function ask(msg, ok, danger, input) {
  return new Promise(res => {
    const w = document.createElement('div');
    w.className = 'ask';
    w.innerHTML = '<div class="scrim on"></div><div class="card" role="alertdialog" aria-modal="true" style="position:relative;z-index:1"><p>' + esc(msg) + '</p>' +
      (input ? '<input class="inp" style="margin-top:14px" placeholder="' + esc(input) + '">' : '') +
      '<div class="acts"><button class="btn light">취소</button><button class="btn' + (danger ? ' warn' : '') + '">' + esc(ok || '확인') + '</button></div></div>';
    document.body.appendChild(w);
    const [no, yes] = w.querySelectorAll('.acts .btn');
    const inp = w.querySelector('input');
    const close = v => { w.remove(); res(v); };
    no.onclick = () => close(false);
    w.querySelector('.scrim').onclick = () => close(false);
    yes.onclick = () => { if (input && inp.value.trim() !== input) { inp.classList.add('bad'); inp.focus(); return; } close(true); };
    (inp || yes).focus();
  });
}

// ───── 로그인 ─────
function showLogin(must) {
  $('#app').hidden = true; $('#login').hidden = false;
  const f = $('#lf');
  if (must) {
    f.innerHTML = '<p style="font-weight:700;font-size:18px">' + esc(U.name) + ' 선생님, 새 PIN을 정해 주세요</p><p class="muted" style="margin:6px 0 18px">처음 로그인하셨어요. 앞으로 쓸 숫자 6자리를 정해 주세요.</p>' +
      '<label class="field"><span>새 PIN</span><input class="inp pin" id="np1" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>' +
      '<label class="field"><span>한 번 더</span><input class="inp pin" id="np2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>' +
      '<div class="err" id="lerr"></div><button class="btn block" style="margin-top:8px">PIN 저장하고 시작하기</button>';
    f.onsubmit = async e => {
      e.preventDefault();
      const a = $('#np1').value, b = $('#np2').value;
      if (!/^\d{6}$/.test(a)) return $('#lerr').textContent = '숫자 6자리로 정해 주세요.';
      if (a !== b) return $('#lerr').textContent = '두 번 적은 PIN이 달라요.';
      try { await call('pinSet', { pin: a }); U.must = false; store.set(KEY, U); start(); }
      catch (err) { $('#lerr').textContent = err.message; }
    };
    $('#np1').focus();
    return;
  }
  f.innerHTML = '<label class="field"><span>이름</span><input class="inp" id="ln" autocomplete="username" maxlength="20"></label>' +
    '<label class="field"><span>PIN (숫자 6자리)</span><input class="inp pin" id="lp" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"></label>' +
    '<div class="err" id="lerr"></div><button class="btn block" style="margin-top:8px">로그인</button>' +
    '<p class="muted" style="margin-top:14px;text-align:center">처음이면 PIN은 000000이에요.</p>';
  const last = store.get('rt-last-name'); if (last) $('#ln').value = last;
  f.onsubmit = async e => {
    e.preventDefault();
    $('#lerr').textContent = '';
    const btn = f.querySelector('.btn'); btn.disabled = true;
    try {
      const n = $('#ln').value.trim();
      U = await call('login', { n, p: $('#lp').value });
      store.set('rt-last-name', n);
      store.set(KEY, U);
      U.must ? showLogin(true) : start();
    } catch (err) { $('#lerr').textContent = err.message; btn.disabled = false; }
  };
  (last ? $('#lp') : $('#ln')).focus();
}
async function logout(silent) {
  if (!silent && U) { try { await call('logout'); } catch (e) { } }
  U = null; D = null; store.del(KEY);
  try { sessionStorage.removeItem('rt-d'); } catch (e) { }
  closeSheet();
  showLogin();
}

// ───── 시작 ─────
async function start() {
  $('#login').hidden = true; $('#app').hidden = false;
  $('#gear').hidden = !isAdmin();
  $('#tabs').innerHTML = TABS.map(t => '<button data-t="' + t[0] + '">' + ic(t[0] === 'phone' ? 'phone' : t[0]) + t[1] + '</button>').join('');
  $('#tabs').onclick = e => { const b = e.target.closest('button'); if (b) show(b.dataset.t); };
  $('#v').innerHTML = '<div class="empty">불러오는 중…</div>';
  const h = location.hash.slice(1);
  if (h && (TABS.some(t => t[0] === h) || h === 'settings')) tab = h;
  await load();
}
async function load() {
  if (!D) { try { const c = JSON.parse(sessionStorage.getItem('rt-d') || 'null'); if (c && c.me && c.me.name === U.name) set(c); } catch (e) { } }
  const r = await run(() => call('data'));
  if (!r) { if (!D) $('#v').innerHTML = '<div class="empty"><b>불러오지 못했어요</b>잠시 후 위의 새로고침을 눌러 주세요.</div>'; return; }
  set(r);
}
function set(r) {
  try { sessionStorage.setItem('rt-d', JSON.stringify(r)); } catch (e) { }
  D = r;
  $('#ttl').textContent = D.cfg.title || '수련회';

  if (openId) { D.byId[openId] ? person(openId) : D.tById[openId] ? teacher(openId) : closeSheet(); }
}
function show(t, keep) {
  if (t === 'settings' && !isAdmin()) t = 'home';
  tab = t;
  history.replaceState(null, '', '#' + t);
  $$('#tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.t === t ? 'page' : 'false'));
  if (!D) return;
  const y = keep ? window.scrollY : 0;
  $('#v').innerHTML = V[t]();
  if (B[t]) B[t]();
  window.scrollTo(0, y);
}

const V = {}, B = {};

function dday() {
  const s = D.cfg.start;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
  const today = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));
  today.setHours(0, 0, 0, 0);
  const st = new Date(s + 'T00:00:00');
  const diff = Math.round((st - today) / 864e5);
  const days = +D.cfg.days || 3;
  if (diff > 0) return { big: 'D-' + diff, txt: '수련회까지' };
  if (diff > -days) return { big: (1 - diff) + '일차', txt: '수련회 진행 중', day: 1 - diff };
  return { big: '끝', txt: '수련회를 마쳤어요' };
}

    '<div class="box" id="toPay" role="button" style="cursor:pointer"><div class="k">회비 입금</div><div class="v">' + paid + '<small>/' + a.length + '</small></div><div class="bar ok"><i style="width:' + (a.length ? paid / a.length * 100 : 0) + '%"></i></div></div>' +
    '<div class="box"><div class="k">조 배정</div><div class="v">' + placed + '<small>/' + a.length + '</small></div><div class="bar"><i style="width:' + (a.length ? placed / a.length * 100 : 0) + '%"></i></div></div>' +
    '<div class="box"><div class="k">희망 친구와 같은 조</div><div class="v">' + rep.happy + '<small>/' + rep.wishers + '</small></div><div class="muted">희망을 적은 학생 기준</div></div>' +
    '<div class="box" id="toT" role="button" style="cursor:pointer"><div class="k">선생님 참석</div><div class="v">' + D.tAct.length + '<small>명</small></div><div class="split"><span class="tag dim">본발 ' + D.tAct.filter(isMainT).length + '</span><span class="tag dim">후발 ' + D.tAct.filter(t => !isMainT(t)).length + '</span></div></div>' +
    '<div class="box" id="toTPay" role="button" style="cursor:pointer"><div class="k">선생님 회비</div><div class="v">' + D.tAct.filter(t => t.paid === '예').length + '<small>/' + D.tAct.length + '</small></div><div class="bar ok"><i style="width:' + (D.tAct.length ? D.tAct.filter(t => t.paid === '예').length / D.tAct.length * 100 : 0) + '%"></i></div></div>' +

    '<div class="sec"><h2>신청 페이지 <small>' + (D.open ? '신청 받는 중' : '닫혀 있음') + '</small></h2><div class="box linkbox">' +
    '<img alt="신청 페이지 QR 코드" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=10&data=' + encodeURIComponent(APPLY_URL) + '">' +

}

// 명단
const FILTERS = [['all', '전체'], ['m', '남'], ['f', '여'], ['none', '미배정'], ['pay', '회비 체크'], ['health', '건강 특이사항'], ['off', '취소']];

let payBusy = 0, payLast = null;
async function togglePay(id, isT, fromSheet) {
  const p = isT ? D.tById[id] : D.byId[id]; if (!p) return;
  const on = p.paid !== '예', t = new Date();
  if (!on && !(await ask(p.name + (isT ? ' 선생님' : ' 학생') + '을 회비 미납으로 되돌릴까요?', '미납으로'))) return;
  const note = on ? (t.getMonth() + 1) + '/' + t.getDate() + ' 확인 (' + U.name + ')' : '';
  p.paid = on ? '예' : ''; p.paynote = note;
  if (fromSheet) teacher(id); else show(tab, true);
  payBusy++;
  try {
    payLast = await call(isT ? 'teacherSave' : 'personSave', { id, fields: { paid: on, paynote: note } });
    toast(p.name + ' ' + (on ? '입금 확인했어요' : '미납으로 바꿨어요'));
  } catch (e) {
    p.paid = on ? '' : '예'; toast((e.message || '저장하지 못했어요') + ' 다시 눌러 주세요.');
    show(tab, true);
  } finally {
    if (--payBusy === 0 && payLast) { const r = payLast; payLast = null; set(r); }
  }
}

// 일정
function dayLabel(i) {
  const s = D.cfg.start;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return '';
  const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + i - 1);
  return (d.getMonth() + 1) + '/' + d.getDate() + '(' + '일월화수목금토'[d.getDay()] + ')';
}
V.plan = () => {
  const days = Math.max(1, +D.cfg.days || 3);
  const dd = dday();
  const day = sub.day || (dd && dd.day) || 1;
  sub.day = day;
  const rows = D.plan.filter(x => String(+x.day || 1) === String(day)).sort((a, b) => a.time.localeCompare(b.time));
  const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));
  const hm = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  const isToday = dd && dd.day === day;
  let nowIdx = -1;
  if (isToday) rows.forEach((x, i) => { if (x.time && x.time <= hm) nowIdx = i; });
  const tabs = '<div class="days" role="group">' + Array.from({ length: days }, (_, i) => '<button data-d="' + (i + 1) + '" aria-pressed="' + (day === i + 1) + '">' + (i + 1) + '일차' + (dayLabel(i + 1) ? '<small>' + dayLabel(i + 1) + '</small>' : '') + '</button>').join('') + '</div>';
  if (sub.editPlan) {
    return tabs + '<div class="box" style="padding:0">' + rows.map((x, i) => planEd(x, i)).join('') +
      '<div style="padding:12px;display:flex;gap:8px"><button class="btn light small" id="pAdd">일정 추가</button></div></div>' +
      '<div class="acts" style="margin-top:14px"><button class="btn light" id="pCancel">취소</button><button class="btn" id="pSave">' + day + '일차 일정 저장</button></div>';
  }
  return tabs + (rows.length ? '<div class="tl">' + rows.map((x, i) => '<div class="ti' + (i === nowIdx ? ' now' : '') + '"><div class="tm">' + esc(x.time) + (x.end ? '<small>~ ' + esc(x.end) + '</small>' : '') + '</div><div><div class="tt">' + esc(x.title) + '</div>' +
      ([x.place, x.who].some(Boolean) ? '<div class="td">' + esc([x.place, x.who ? '담당 ' + x.who : ''].filter(Boolean).join(', ')) + '</div>' : '') + (x.note ? '<div class="td">' + esc(x.note) + '</div>' : '') + '</div></div>').join('') + '</div>'
    : '<div class="box empty"><b>' + day + '일차 일정이 아직 없어요</b>' + (isAdmin() ? '아래 버튼으로 시간표를 넣어 주세요.' : '관리자가 일정을 넣으면 여기에 보여요.') + '</div>') +
    (isAdmin() ? '<button class="btn light block" id="pEdit" style="margin-top:14px">' + day + '일차 일정 고치기</button>' : '');
};

function roomRider(r) {

  const lead = D.tById[r.tid], cov = D.tById[r.cid];

  return null;
}
const TFILTERS = [['all', '전체'], ['진행팀', '진행팀'], ['조장팀', '조장팀'], ['지원팀', '지원팀'], ['중보팀', '중보팀'], ['none', '팀 미정'], ['late', '후발'], ['car', '자차'], ['pay', '회비 체크'], ['off', '취소']];
function seg() {

}
function tlist() {
  const fl = sub.tflt || 'all', q = (sub.tq || '').trim();
  let L = D.teachers.filter(t => {
    if (fl === 'off') return t.join !== '예';
    if (t.join !== '예') return false;
    if (TEAMS.indexOf(fl) >= 0) return t.team === fl;
    if (fl === 'none') return !t.team;
    if (fl === 'late') return !isMainT(t);
    if (fl === 'car') return t.move === '자차';
    return true;
  });
  if (q) L = L.filter(t => [t.name, t.dept, t.phone, t.team, t.hope, t.role].join(' ').indexOf(q) >= 0 || digits(t.phone).indexOf(digits(q) || '@') >= 0);
  L.sort((a, b) => (ROLES.indexOf(a.role) + 1 || 9) - (ROLES.indexOf(b.role) + 1 || 9) || a.name.localeCompare(b.name, 'ko'));
  const A = D.tAct;

    '<div class="sec" id="tBox"><h2>교사 신청</h2><div class="box"><div class="choice" id="topenSel"><button data-v="예" aria-pressed="' + (c.topen === '예') + '">교사 신청 받기</button><button data-v="아니오" aria-pressed="' + (c.topen !== '예') + '">닫기</button></div>' +
    '<p class="muted" style="margin:10px 0 16px">' + (D.topen ? '지금 교사 신청 페이지에서 신청할 수 있어요.' : '지금은 교사 신청 페이지가 닫혀 있어요.') + '</p>' +
    fld(['tdeadline', '교사 신청 마감일', '', 'date']) + fld(['tfee', '교사 회비', '예: 전일 95,000원 / 부분 참석 45,000원']) +
    fld(['tnotice', '교사 신청 안내 (첫 화면)', '', 'area']) +
    '<label class="field"><span>출발 선택지 <small class="muted">한 줄에 하나, 첫 줄이 본발</small></span><textarea class="inp" data-c="tarrive" rows="4">' + esc(String(c.tarrive || '').replace(/\\n/g, '\n')) + '</textarea></label>' +
    '<div class="field"><span class="label">선생님도 여행자보험에 가입하나요?</span><div class="choice" id="tinsSel"><button data-v="예" aria-pressed="' + (c.tins === '예') + '">네 (주민번호 받기)</button><button data-v="아니오" aria-pressed="' + (c.tins !== '예') + '">아니요</button></div></div>' +
    '<button class="btn block" id="tcfgSave">교사 신청 설정 저장</button></div></div>' +
    '<div class="sec" id="busBox"><h2>버스</h2><div class="box">' + fld(['seats', '버스 좌석 수', '', 'number']) + fld(['staff', '버스마다 비워 둘 좌석 (스태프용)', '', 'number']) +
    '<div class="field"><span class="label">담당 선생님도 조와 같은 버스에 타나요?</span><div class="choice" id="rideSel"><button data-v="예" aria-pressed="' + (c.ride !== '아니오') + '">네</button><button data-v="아니오" aria-pressed="' + (c.ride === '아니오') + '">아니요</button></div></div>' +
    '<button class="btn block" id="busSave">버스 설정 저장</button></div></div>' +
    '<div class="sec" id="roomsBox"><h2>조(숙소) <small>숙소 = 조</small></h2><p class="muted" style="margin:-4px 2px 10px">정원은 학생 수 기준이에요. 남녀는 같은 조가 될 수 없어요. 특정 조를 정한 버스에 태우려면 버스 칸에 호차 번호를 적어 주세요.</p>' +
    '<div class="box" style="padding:0" id="rtBox">' + D.rooms.map(roomEd).join('') + '<div style="padding:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn light small" id="rAdd">조 추가</button><button class="btn light small" id="rAdd5">5개 한꺼번에 추가</button></div></div>' +
    '<button class="btn block" id="rSave" style="margin-top:12px">조(숙소) 저장</button></div>' +
    '<div class="sec"><h2>계정</h2><div class="box" style="padding:0" id="accBox"><p class="muted" style="padding:14px">불러오는 중…</p></div>' +
    '<div class="box" style="margin-top:10px"><p style="font-weight:700;margin-bottom:10px">계정 추가</p><div style="display:flex;gap:8px;flex-wrap:wrap"><input class="inp" id="aName" placeholder="이름" style="flex:1;min-width:120px"><select class="inp" id="aRole" style="flex:0 0 130px"><option value="lead">조 담당</option><option value="admin">관리자</option></select></div>' +
    '<p class="muted" style="margin:8px 0 12px">처음 PIN은 000000이고, 첫 로그인 때 본인이 새 PIN을 정해요. 조 담당은 모든 내용을 볼 수 있지만 고칠 수는 없어요.</p><button class="btn block" id="aAdd">계정 추가</button></div></div>' +
    '<div class="sec"><h2>링크</h2><div class="box"><dl class="kv"><dt>신청 페이지</dt><dd><a href="' + APPLY_URL + '" target="_blank" rel="noopener">' + esc(APPLY_URL) + '</a></dd><dt>교사 신청</dt><dd><a href="' + TEACHER_URL + '" target="_blank" rel="noopener">' + esc(TEACHER_URL) + '</a></dd><dt>운영 앱</dt><dd>' + esc(location.href.split('#')[0]) + '</dd></dl>' +
    '<div class="acts" style="margin-top:14px"><button class="btn light" id="cpA">신청 링크 복사</button><button class="btn light" id="cpT">교사 링크 복사</button><button class="btn light" id="cpB">운영 앱 링크 복사</button><a class="btn light" target="_blank" rel="noopener" href="https://api.qrserver.com/v1/create-qr-code/?size=1000x1000&margin=40&data=' + encodeURIComponent(APPLY_URL) + '">신청 QR 크게 보기</a></div></div></div>' +
    '<div class="sec"><h2>여행자보험·개인정보</h2><div class="box danger">' +
    '<p>보험 가입할 때 <b>보험명단</b>을 내려받아 ' + esc(c.insurer || '보험사') + '에 보내 주세요. 가입을 마치면 주민등록번호를 파기해 주세요.</p>' +
    '<p class="muted" style="margin-top:6px">' + (c.purged ? '주민등록번호를 ' + esc(c.purged.slice(0, 16)) + '에 파기했어요. 그 뒤에 들어온 신청 ' + D.people.filter(p => p.hasRrn).length + '건은 아직 남아 있어요.' : '주민등록번호가 있는 신청 ' + D.people.filter(p => p.hasRrn).length + '건' + (D.teachers.some(t => t.hasRrn) ? ' (선생님 ' + D.teachers.filter(t => t.hasRrn).length + '건 별도)' : '')) + '</p>' +
    '<div class="acts" style="margin-top:14px"><button class="btn light" id="ins">보험명단 내려받기</button><button class="btn warn" id="purge">주민등록번호 파기</button></div></div></div>' +
    '<div class="sec"><h2>테스트 정리</h2><div class="box"><p class="muted">테스트로 넣은 신청서를 모두 지울 때 써요. 실제 신청을 받기 시작한 뒤에는 누르지 마세요.</p><button class="btn light block" id="wipe" style="margin-top:12px;color:var(--alert)">학생 신청서 모두 지우기</button><button class="btn light block" id="wipeT" style="margin-top:8px;color:var(--alert)">교사 신청서 모두 지우기</button></div></div>';
};
function roomEd(r) {
  r = r || {};
  return '<div class="rt"><input class="inp" data-r="no" placeholder="조" value="' + esc(r.no || '') + '" inputmode="numeric"><select class="inp" data-r="gender"><option value="">성별</option><option' + (r.gender === '남' ? ' selected' : '') + '>남</option><option' + (r.gender === '여' ? ' selected' : '') + '>여</option></select>' +
    '<input class="inp" data-r="name" placeholder="숙소 (예: 301호)" value="' + esc(r.name || '') + '">' +
    '<input class="inp" data-r="cap" placeholder="정원" inputmode="numeric" value="' + esc(r.cap || '') + '"><input class="inp wide" data-r="teacher" placeholder="담당 선생님" value="' + esc(r.teacher || '') + '">' +
    '<div class="full"><input class="inp" data-r="tphone" placeholder="선생님 연락처" inputmode="tel" value="' + esc(r.tphone || '') + '"><input class="inp" data-r="bus" placeholder="버스 지정" inputmode="numeric" style="flex:0 0 96px" value="' + esc(r.bus || '') + '"><button class="link" data-rdel style="color:var(--alert);flex:none">삭제</button></div></div>';
}
B.settings = () => {
  $('#back').onclick = () => show('home');
  const choiceBind = (id, cb) => $$('#' + id + ' button').forEach(b => b.onclick = () => { $$('#' + id + ' button').forEach(x => x.setAttribute('aria-pressed', x === b)); cb(b.dataset.v); });
  choiceBind('openSel', async v => { const r = await run(() => call('cfgSave', { cfg: { open: v } }), v === '예' ? '신청을 받기 시작했어요' : '신청을 닫았어요'); if (r) set(r); });
  let ride = D.cfg.ride !== '아니오' ? '예' : '아니오';
  choiceBind('rideSel', v => ride = v);
  const val = k => { const e = document.querySelector('[data-c="' + k + '"]'); return e ? e.value.trim() : ''; };
  $('#cfgSave').onclick = async () => { const cfg = {}; CFG_FORM.forEach(x => cfg[x[0]] = val(x[0])); const r = await run(() => call('cfgSave', { cfg }), '수련회 정보를 저장했어요'); if (r) set(r); };
  let tins = D.cfg.tins === '예' ? '예' : '아니오';
  choiceBind('tinsSel', v => tins = v);
  choiceBind('topenSel', async v => { const r = await run(() => call('cfgSave', { cfg: { topen: v } }), v === '예' ? '교사 신청을 받기 시작했어요' : '교사 신청을 닫았어요'); if (r) set(r); });
  $('#tcfgSave').onclick = async () => { const r = await run(() => call('cfgSave', { cfg: { tdeadline: val('tdeadline'), tfee: val('tfee'), tnotice: val('tnotice'), tarrive: val('tarrive'), tins } }), '교사 신청 설정을 저장했어요'); if (r) set(r); };
  $('#busSave').onclick = async () => { const r = await run(() => call('cfgSave', { cfg: { seats: val('seats'), staff: val('staff'), ride } }), '버스 설정을 저장했어요'); if (r) set(r); };
  const rbox = $('#rtBox');
  const bindDel = () => $$('[data-rdel]').forEach(b => b.onclick = () => b.closest('.rt').remove());
  const addRows = n => {
    const nums = $$('.rt [data-r=no]').map(i => +i.value).filter(x => x > 0);
    let next = nums.length ? Math.max.apply(null, nums) + 1 : 1;
    const g = ($$('.rt [data-r=gender]').slice(-1)[0] || {}).value || '';
    const cap = ($$('.rt [data-r=cap]').slice(-1)[0] || {}).value || '';
    for (let i = 0; i < n; i++) { const t = document.createElement('div'); t.innerHTML = roomEd({ no: next++, gender: g, cap }); rbox.lastElementChild.before(t.firstChild); }
    bindDel();
  };
  $('#rAdd').onclick = () => addRows(1);
  $('#rAdd5').onclick = () => addRows(5);
  bindDel();
  $('#rSave').onclick = async () => {
    const rooms = $$('.rt').map(e => { const o = {}; e.querySelectorAll('[data-r]').forEach(i => o[i.dataset.r] = i.value.trim()); return o; }).filter(o => o.no || o.name || o.teacher);
    const r = await run(() => call('roomsSave', { rooms }), '조(숙소)를 저장했어요');
    if (r) set(r);
  };
  $('#cpA').onclick = () => copy(APPLY_URL);
  $('#cpB').onclick = () => copy(location.href.split('#')[0]);
  $('#cpT').onclick = () => copy(TEACHER_URL);
  $('#ins').onclick = async () => {
    if (!await ask('주민등록번호가 들어 있는 보험명단을 이 기기에 내려받아요.\n보험사에 보낸 뒤에는 파일을 지워 주세요.', '내려받기')) return;
    const rows = await run(() => call('insurance'));
    if (!rows) return;
    if (!rows.length) return toast('참가 신청한 학생이 없어요');
    const head = ['순번', '이름', '성별', '생년월일', '주민등록번호', '학생 연락처', '보호자', '보호자 연락처'];
    const csv = '﻿' + [head].concat(rows).map(r => r.map(x => '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    const d = new Date();
    a.download = '보험명단_' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    toast(rows.length + '명 보험명단을 내려받았어요');
  };
  $('#purge').onclick = async () => {
    if (!await ask('모든 신청서의 주민등록번호를 지울까요?\n보험 가입을 마친 뒤에만 눌러 주세요. 되돌릴 수 없어요.\n\n확인하려면 아래에 파기 라고 적어 주세요.', '파기', true, '파기')) return;
    const r = await run(() => call('purge'), '주민등록번호를 파기했어요');
    if (r) set(r);
  };
  $('#wipe').onclick = async () => {
    if (!await ask('신청서를 모두 지울까요? 되돌릴 수 없어요.\n\n확인하려면 아래에 모두 지우기 라고 적어 주세요.', '모두 지우기', true, '모두 지우기')) return;
    const r = await run(() => call('clearPeople'), '신청서를 모두 지웠어요');
    if (r) set(r);
  };
  $('#wipeT').onclick = async () => {
    if (!await ask('교사 신청서를 모두 지울까요? 되돌릴 수 없어요.\n\n확인하려면 아래에 모두 지우기 라고 적어 주세요.', '모두 지우기', true, '모두 지우기')) return;
    const r = await run(() => call('clearTeachers'), '교사 신청서를 모두 지웠어요');
    if (r) set(r);
  };
  $('#aAdd').onclick = async () => {
    const name = $('#aName').value.trim();
    if (!name) return toast('이름을 적어 주세요');
    const L = await run(() => call('accSave', { name, role: $('#aRole').value }), name + ' 계정을 만들었어요');
    if (L) { $('#aName').value = ''; accRender(L); }
  };
  run(() => call('accounts')).then(L => L && accRender(L));
};
function accRender(L) {
  const box = $('#accBox'); if (!box) return;
  box.innerHTML = L.map(a => '<div class="acc"><span class="nm">' + esc(a.name) + (a.name === U.name ? ' <span class="muted" style="font-weight:500">나</span>' : '') + '</span>' +
    '<span class="tag ' + (a.role === 'admin' ? 'lamp' : 'dim') + '">' + (a.role === 'admin' ? '관리자' : '조 담당') + '</span>' + (a.locked ? '<span class="tag must">잠김</span>' : a.must ? '<span class="tag opt">첫 로그인 전</span>' : '') +
    (a.name === U.name ? '' : '<button class="link" data-role="' + esc(a.name) + '" data-to="' + (a.role === 'admin' ? 'lead' : 'admin') + '">' + (a.role === 'admin' ? '조 담당으로' : '관리자로') + '</button><button class="link" data-reset="' + esc(a.name) + '">PIN 초기화</button><button class="link" style="color:var(--alert)" data-del="' + esc(a.name) + '">삭제</button>') + '</div>').join('');
  box.querySelectorAll('[data-role]').forEach(b => b.onclick = async () => { const r = await run(() => call('accSave', { name: b.dataset.role, role: b.dataset.to }), '권한을 바꿨어요'); if (r) accRender(r); });
  box.querySelectorAll('[data-reset]').forEach(b => b.onclick = async () => { if (!await ask(b.dataset.reset + ' 선생님 PIN을 000000으로 되돌릴까요?\n잠김도 함께 풀려요.', 'PIN 초기화')) return; const r = await run(() => call('accReset', { name: b.dataset.reset }), 'PIN을 초기화했어요'); if (r) accRender(r); });
  box.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { if (!await ask(b.dataset.del + ' 선생님 계정을 지울까요?', '삭제', true)) return; const r = await run(() => call('accDel', { name: b.dataset.del }), '계정을 지웠어요'); if (r) accRender(r); });
}

$('#reload').onclick = () => load();
$('#gear').onclick = () => show('settings');
$('#out').onclick = async () => { if (await ask('로그아웃할까요?', '로그아웃')) logout(); };
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && U && D && Date.now() - (load.t || 0) > 60000) { load.t = Date.now(); load(); } });

U = store.get(KEY);
if (U && U.tk && !U.must) start(); else { U = null; showLogin(); }
</script>
</body>
