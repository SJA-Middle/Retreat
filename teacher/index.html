<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17214A">
<title>2027년 겨울수련회 교사신청서</title>
<meta name="description" content="새중앙교회 드림공동체 중등부 수련회 교사 참석 신청">
<meta property="og:title" content="2027년 겨울수련회 교사신청서">
<meta property="og:description" content="수련회를 함께 섬길 선생님들의 참석 신청서">
<link rel="icon" href="../logo.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<link rel="stylesheet" href="../style.css">
<style>
.sky .in { max-width: 620px; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top)) 20px 84px; }
.org { font-size: 19px; color: #ffffffe6; font-weight: 700; letter-spacing: -.01em; line-height: 1.35; }
body { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
#main { width: 100%; }
body.home main { padding-bottom: 32px; }
.state { display: inline-flex; align-items: center; gap: 7px; margin-top: 30px; padding: 5px 12px 5px 10px; border-radius: 999px; font-size: 14px; font-weight: 700; background: var(--lantern); color: var(--night); }
.state::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--night); box-shadow: 0 0 0 3px #17214A33; }
.state.closed { background: #ffffff22; color: #fff; }
.state.closed::before { background: #ffffff88; box-shadow: none; }
h1.title { font-family: var(--display); font-weight: 400; font-size: clamp(36px, 9.6vw, 64px); line-height: 1.12; letter-spacing: -.01em; margin-top: 14px; }
h1.title span { display: block; }
h1.title em { font-style: normal; color: var(--lantern); }
.org img { height: 18px; width: auto; display: block; }
.org { display: flex; align-items: center; gap: 7px; }
.theme { margin-top: 14px; color: #ffffffdd; }
.theme span { display: block; }
.theme .t1 { font-size: 22px; font-weight: 800; color: var(--lantern); letter-spacing: .01em; }
.theme .t2 { font-size: 16px; font-weight: 500; margin-top: 2px; }
.sky.compact .org { font-size: 14px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; margin: 28px 0 0; font-size: 16px; }
.facts dt { color: #ffffff99; font-size: 14px; padding-top: 1px; }
.facts dd { margin: 0; font-weight: 600; }
.sky.compact .in { padding-top: calc(14px + env(safe-area-inset-top)); padding-bottom: 46px; }
.sky.compact h1.title { font-size: 26px; margin-top: 6px; }
.sky.compact h1.title .t2 { display: none; }
.sky.compact .org img { height: 15px; }
.sky.compact .state, .sky.compact .theme, .sky.compact .facts { display: none; }
.sky.compact .ridge { height: 30px; }

main { max-width: 620px; margin: 0 auto; padding: 4px 16px calc(120px + env(safe-area-inset-bottom)); }
.intro { background: var(--paper); border-radius: var(--r-l); padding: 22px 20px; margin-top: -10px; position: relative; box-shadow: 0 10px 30px -18px #17214A55; }
.intro p + p { margin-top: 10px; }
.intro .notice { white-space: pre-line; }
.intro .muted { color: var(--sub); font-size: 15px; }
.intro .btn { margin-top: 22px; }
.draft { margin-top: 12px; font-size: 14px; color: var(--sub); text-align: center; }

.prog { position: sticky; top: 0; z-index: 5; background: var(--snow); padding: 14px 0 12px; margin: 0 0 6px; }
.prog .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--sub); }
.prog b { font-size: 18px; color: var(--ink); }
.prog .bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 10px; overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--night); border-radius: 3px; transition: width .3s; }

.panel { background: var(--paper); border-radius: var(--r-l); padding: 22px 18px 6px; }
.panel h2 { font-size: 22px; line-height: 1.35; margin-bottom: 6px; }
.panel .lead { color: var(--sub); font-size: 15px; margin-bottom: 22px; }
.notes { margin: 4px 0 20px; padding: 14px 16px 14px 34px; background: var(--snow); border-radius: var(--r-m); font-size: 14px; color: var(--sub); }
.notes li + li { margin-top: 4px; }
.etc { margin-top: 8px; }

.cons { border: 1.5px solid var(--line); border-radius: var(--r-m); margin-bottom: 12px; overflow: hidden; }
.cons.on { border-color: var(--night-2); }
.cons .top { display: flex; align-items: center; gap: 12px; padding: 14px 14px; cursor: pointer; }
.cons .top input { width: 24px; height: 24px; accent-color: var(--night); flex: none; margin: 0; }
.cons .top .t { flex: 1; font-weight: 600; font-size: 16px; line-height: 1.4; }
.cons details { border-top: 1px solid var(--line); background: #FAFBFD; }
.cons summary { padding: 10px 14px; font-size: 14px; color: var(--sub); cursor: pointer; list-style: none; }
.cons summary::-webkit-details-marker { display: none; }
.cons summary::after { content: ' ▾'; }
.cons details[open] summary::after { content: ' ▴'; }
.cons .doc { padding: 0 14px 14px; font-size: 14px; line-height: 1.6; color: var(--ink); }
.cons .doc p + p { margin-top: 8px; }
.cons .doc b { display: block; font-weight: 700; color: var(--night); }
.cons .doc b::before { content: '■ '; font-size: 11px; vertical-align: 1px; }
.fcard { border: 1.5px solid var(--line); border-radius: var(--r-m); padding: 14px 14px 0; margin-bottom: 12px; }
.fcard.bad { border-color: var(--alert); }
.fcard .fh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: 700; }
.fcard .field { margin-bottom: 14px; }
.fcard .two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.addf { margin: 2px 0 20px; }
.allbtn { margin-bottom: 14px; }
.cons.bad { border-color: var(--alert); }

.rrn { display: flex; align-items: center; gap: 8px; }
.rrn .inp { text-align: center; letter-spacing: .12em; font-variant-numeric: tabular-nums; }
.rrn .inp:first-child { flex: 6; } .rrn .inp:last-of-type { flex: 7; }
.rrn .dash { color: var(--mist); font-size: 20px; }
.eye { margin-top: 6px; }
.lock { display: flex; gap: 10px; align-items: flex-start; background: var(--snow); border-radius: var(--r-m); padding: 12px 14px; font-size: 14px; color: var(--sub); margin: -4px 0 20px; }
.lock svg { flex: none; margin-top: 2px; }

.review { margin: 0 0 18px; }
.review h3 { display: flex; justify-content: space-between; align-items: center; font-size: 16px; padding: 12px 0 8px; border-bottom: 1px solid var(--line); }
.review dl { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; margin: 10px 0 0; font-size: 15px; }
.review dt { color: var(--sub); }
.review dd { margin: 0; font-weight: 600; }

.actions { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: linear-gradient(transparent, var(--snow) 22%); padding: 22px 16px calc(14px + env(safe-area-inset-bottom)); }
.actions .in { max-width: 620px; margin: 0 auto; display: flex; gap: 10px; }
.actions .btn.light { flex: 0 0 104px; }
.actions .btn:last-child { flex: 1; }

/* 접수증 */
.ticket { margin: 18px auto 0; max-width: 420px; filter: drop-shadow(0 18px 30px #17214A30); }
.ticket .head { background: var(--night); color: #fff; border-radius: 22px 22px 0 0; padding: 22px 22px 26px; position: relative; overflow: hidden; }
.ticket .head small { color: #ffffffaa; font-size: 13px; }
.ticket .head h2 { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.15; margin-top: 4px; }
.ticket .head p { color: #ffffffcc; font-size: 14px; margin-top: 8px; }
.ticket .head p.when { line-height: 1.7; }
.ticket .head p.when span { color: #ffffff88; margin-right: 8px; }
.ticket .cut { height: 22px; background:
  radial-gradient(circle at 0 50%, transparent 11px, var(--paper) 11.5px) left / 51% 100% no-repeat,
  radial-gradient(circle at 100% 50%, transparent 11px, var(--paper) 11.5px) right / 51% 100% no-repeat; position: relative; }
.ticket .cut::after { content: ''; position: absolute; left: 18px; right: 18px; top: 50%; border-top: 2px dashed var(--line); }
.ticket .body { background: var(--paper); border-radius: 0 0 22px 22px; padding: 6px 22px 22px; }
.ticket .no { display: flex; align-items: baseline; justify-content: space-between; }
.ticket .no span { color: var(--sub); font-size: 14px; }
.ticket .no b { font-family: var(--display); font-weight: 400; font-size: 52px; line-height: 1; color: var(--night); letter-spacing: .02em; }
.ticket dl { display: grid; grid-template-columns: 86px 1fr; gap: 8px 12px; margin: 16px 0 0; font-size: 15px; }
.ticket dt { color: var(--sub); }
.ticket dd { margin: 0; font-weight: 600; }
.ticket .pay { margin-top: 18px; padding: 12px 14px; border-radius: 12px; background: #FDF6E3; font-size: 14px; color: #6B4B00; }
.after { text-align: center; color: var(--sub); font-size: 14px; margin-top: 22px; }
.after .btn { margin-top: 14px; }
.fail { background: var(--paper); border-radius: var(--r-l); padding: 22px 20px; margin-top: -10px; position: relative; }
.who { display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 8px; background: #ffffff1f; color: #fff; font-weight: 700; font-size: 15px; }
.sky.compact .who { margin-top: 4px; font-size: 13px; padding: 2px 10px; }
.choice.col { flex-direction: column; }
.choice.col button { text-align: left; flex: none; }
.teams { display: grid; gap: 8px; }
.teams .team { display: block; text-align: left; padding: 12px 14px; border-radius: var(--r-m); border: 1.5px solid var(--line); background: var(--paper); cursor: pointer; }
.teams .team b { display: block; font-size: 16px; color: var(--ink); }
.teams .team span { display: block; font-size: 13px; color: var(--sub); margin-top: 2px; line-height: 1.45; }
.teams .team[aria-pressed="true"] { border-color: var(--night); background: var(--night); }
.teams .team[aria-pressed="true"] b, .teams .team[aria-pressed="true"] span { color: #fff; }
.cons .t small { display: block; font-weight: 500; font-size: 13px; color: var(--sub); }
.cons.toggle { display: block; }
.lead-box .doc ul { margin: 6px 0 0; padding-left: 18px; }
.lead-box .doc li + li { margin-top: 2px; }
.lead-box.dim .doc { opacity: .6; }
.cons .ft { display: flex; align-items: center; gap: 12px; padding: 12px 14px 14px; cursor: pointer; font-weight: 600; font-size: 16px; border-top: 1px solid var(--line); }
.cons .ft input { width: 24px; height: 24px; accent-color: var(--night); flex: none; margin: 0; }
.ticket.staff .head { background: var(--pine); }
.ticket .no b.nm { font-size: 40px; }
</style>
</head>
<body>
<div id="busy"></div>
<header class="sky" id="sky">
  <div class="in">
    <div class="org"><img src="../sja-mark.png" alt="새중앙교회" onerror="this.remove()"><span>새중앙교회 중등부</span></div>
    <span class="state" id="state" hidden></span>
    <h1 class="title" id="title"><span class="t1">수련회</span><span class="t2"><em>교사</em>신청서</span></h1>
    <p class="theme" id="theme" hidden></p>
    <dl class="facts" id="facts"></dl>
  </div>
  <svg class="ridge" viewBox="0 0 400 56" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 56 L0 38 L38 22 L70 34 L112 8 L150 30 L188 18 L224 36 L262 14 L300 32 L338 20 L372 34 L400 26 L400 56 Z" fill="#24336E" opacity=".9"/>
    <path d="M0 56 L0 46 L48 34 L92 44 L140 30 L186 46 L236 34 L284 46 L330 36 L372 46 L400 40 L400 56 Z" fill="var(--snow)"/>
  </svg>
</header>
<main id="main"></main>
<footer class="brand" id="brand"><img src="../church.png" alt="새중앙교회" onerror="this.remove()"><img class="jd" src="../jungdeung.png" alt="드림공동체 중등부" onerror="this.remove()"></footer>
<div class="actions" id="actions" hidden><div class="in"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="../config.js"></script>
<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let C = null, T = null, step = -1, sending = false;
const F0 = () => ({ name: '', gender: '', dept: '', phone: '', arrive: '', move: '', carpool: '', ride: '', nights: [], hope: '', praise: false, leadHope: false,
  health: '', note: '', c1: false, c2: false, c3: false, c4: false, rrn1: '', rrn2: '', hp: '' });
const F = F0();
const KEEP = ['name', 'gender', 'dept', 'phone', 'arrive', 'move', 'carpool', 'ride', 'nights', 'hope', 'praise', 'leadHope', 'note'];
const DRAFT = 'rt-teacher-draft';
const TEAM_INFO = {
  진행팀: '프로그램 준비와 진행을 맡아요. 찬양팀도 진행팀에 속해요.',
  조장팀: '조를 맡아 아이들과 함께 지내며 돌봐요.',
  지원팀: '간식, 안전 관리, 이동 동선 통제를 맡아요.',
  중보팀: '수련회를 위해 기도로 섬겨요. 잠깐 방문하시는 분도 함께해요.',
  '어디든 괜찮아요': '필요한 곳에 배치해 드릴게요.',
};

function toast(m) { const t = $('#toast'); t.textContent = m; t.className = 'on'; clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 2600); }
function busy(on) { $('#busy').className = on ? 'on' : ''; }
async function api(a, params) {
  busy(true);
  try {
    let r;
    try { r = await fetch(window.RT_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ a, params: params || {} }) }); }
    catch (e) { throw new Error('인터넷 연결을 확인하고 다시 시도해 주세요.'); }
    let j;
    try { j = await r.json(); } catch (e) { throw new Error('서버가 응답하지 않아요. 잠시 후 다시 시도해 주세요.'); }
    if (!j.ok) throw new Error(j.error || '처리하지 못했어요.');
    return j.data;
  } finally { busy(false); }
}
// 쓰다 만 신청서는 저장하지 않는다(다시 들어오면 새 신청서). 예전에 저장된 것도 지운다
function saveDraft() { }
function loadDraft() { clearDraft(); return null; }
function clearDraft() { try { localStorage.removeItem(DRAFT); } catch (e) { } }
const digits = s => String(s || '').replace(/\D/g, '');
function fmtPhone(v) {
  const d = digits(v).slice(0, 11);
  if (d.startsWith('02')) return d.length > 9 ? d.slice(0, 2) + '-' + d.slice(2, 6) + '-' + d.slice(6) : d.length > 5 ? d.slice(0, 2) + '-' + d.slice(2, 5) + '-' + d.slice(5) : d.length > 2 ? d.slice(0, 2) + '-' + d.slice(2) : d;
  if (d.length > 10) return d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7);
  if (d.length > 6) return d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6);
  if (d.length > 3) return d.slice(0, 3) + '-' + d.slice(3);
  return d;
}
const okPhone = v => /^0\d{1,2}-\d{3,4}-\d{4}$/.test(v);
const isMain = () => T && F.arrive === T.arrive[0];
const isVisit = () => false;
const leadOk = () => true;

// ── 머리 ──
function renderHead() {
  $('#title .t1').textContent = C.title || '수련회';
  document.title = (C.title || '수련회') + ' 교사신청서';
  const th = $('#theme'); th.hidden = !C.theme; th.innerHTML = String(C.theme || '').split(/\n|\\n/).map(x => x.trim()).filter(Boolean).map((x, i) => '<span class="t' + (i ? 2 : 1) + '">' + esc(x) + '</span>').join('');
  const st = $('#state'); st.hidden = false;
  st.textContent = T.open ? '교사 신청 받는 중' : '교사 신청 기간이 아니에요';
  st.className = 'state' + (T.open ? '' : ' closed');
  const rows = [['일정', C.dates], ['장소', C.place], ['신청 마감', T.deadline ? fmtDate(T.deadline) + '까지' : '']].filter(r => r[1]);
  $('#facts').innerHTML = rows.map(r => '<dt>' + r[0] + '</dt><dd>' + esc(r[1]) + '</dd>').join('');
}
function fmtDate(s) {
  const d = new Date(s + 'T00:00:00+09:00');
  if (isNaN(d)) return s;
  return (d.getMonth() + 1) + '월 ' + d.getDate() + '일(' + '일월화수목금토'[d.getDay()] + ')';
}
function brand(on) { $('#brand').hidden = !on; document.body.classList.toggle('home', on); }
function renderIntro() {
  step = -1; brand(true);
  $('#sky').classList.remove('compact');
  $('#actions').hidden = true;
  if (!T.open) {
    $('#main').innerHTML = '<section class="intro"><p><b>지금은 교사 신청을 받지 않아요.</b></p><p class="muted">신청 기간이 아니거나 마감되었어요. 수련회 담당 교역자에게 문의해 주세요.</p></section>';
    return;
  }
  const d = loadDraft();
  $('#main').innerHTML = '<section class="intro">' +
    (T.notice ? '<p class="notice">' + esc(T.notice) + '</p>' : '<p>수련회를 함께 섬겨 주시는 선생님들의 참석 신청서예요. 참석 일정과 오시는 방법을 알려 주시면 조와 차량, 숙소 준비에 반영할게요.</p>') +
    '<p class="muted">작성에는 2분 정도 걸려요.' + (T.ins ? ' 여행자보험 가입을 위해 주민등록번호가 필요해요.' : '') + '</p>' +
    '<button class="btn lamp block" id="go">교사 신청서 쓰기</button>' +
    (d && d.name ? '<p class="draft">' + esc(d.name) + ' 선생님 신청서를 쓰던 중이에요. 이어서 쓸 수 있어요.</p>' : '') + '</section>';
  $('#go').onclick = () => { if (d) Object.assign(F, d); if (!Array.isArray(F.nights)) F.nights = []; go(0); };
}

// ── 단계 ──
const STEPS = [
  { t: '기본 정보', r: stepBasic, v: vBasic },
  { t: '참석 일정', r: stepTrip, v: vTrip },
  { t: '개인정보 제공동의', r: stepConsent, v: vConsent },
  { t: '마지막 확인', r: stepReview, v: () => true },
];
function go(i) {
  step = i; brand(false);
  $('#toast').className = '';
  $('#sky').classList.add('compact');
  const s = STEPS[i];
  $('#main').innerHTML = '<div class="prog"><div class="row"><b>' + s.t + '</b><span>' + (i + 1) + ' / ' + STEPS.length + '</span></div>' +
    '<div class="bar"><i style="width:' + ((i + 1) / STEPS.length * 100) + '%"></i></div></div><section class="panel" id="panel"></section>';
  $('#panel').innerHTML = s.r();
  bind();
  const last = i === STEPS.length - 1;
  $('#actions').hidden = false;
  $('#actions .in').innerHTML = '<button class="btn light" id="prev">이전</button><button class="btn' + (last ? ' lamp' : '') + '" id="next">' + (last ? '신청서 보내기' : '다음') + '</button>';
  $('#prev').onclick = () => { saveDraft(); i === 0 ? renderIntro() : go(i - 1); window.scrollTo(0, 0); };
  $('#next').onclick = () => {
    if (!STEPS[i].v()) { const b = document.querySelector('.bad') || $$('.err').find(e => e.textContent); if (b) b.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
    saveDraft();
    if (last) submit(); else { go(i + 1); window.scrollTo(0, 0); }
  };
  window.scrollTo(0, 0);
}
function choice(key, list, labels, cls) {
  return '<div class="choice' + (cls ? ' ' + cls : '') + '" role="group" data-k="' + key + '">' + list.map((v, j) =>
    '<button type="button" data-v="' + esc(v) + '" aria-pressed="' + (String(F[key]) === String(v)) + '">' + (labels ? labels[j] : esc(v)) + '</button>').join('') + '</div>';
}
function input(key, label, o) {
  o = o || {};
  return '<label class="field"><span>' + label + (o.opt ? ' <span class="tag opt">선택</span>' : '') + '</span>' +

    if (first || step === -1 || (!T.open && step < 99)) renderIntro();
  } catch (e) {
    if (C) return;
    $('#main').innerHTML = '<section class="fail"><p><b>신청서를 불러오지 못했어요.</b></p><p style="color:var(--sub);margin-top:8px">' + esc(e.message) + '</p><button class="btn block" style="margin-top:18px" onclick="location.reload()">다시 불러오기</button></section>';
  }
})();
</script>
